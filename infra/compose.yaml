name: zhangqing-ai

services:
  postgres:
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_DB: zhangqing
      POSTGRES_USER: zhangqing
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Password is required}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhangqing -d zhangqing"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
